name: CI

on:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Like Neon's neondb_owner: owns the database but isn't a superuser.
      - name: Create test database
        run: |
          psql postgres://postgres:postgres@localhost:5432/postgres \
            -c "CREATE ROLE neondb_owner LOGIN PASSWORD 'test' CREATEROLE" \
            -c "CREATE DATABASE neondb OWNER neondb_owner"
      - name: Shop isolation tests
        run: npm test
        env:
          DATABASE_URL: postgres://neondb_owner:test@localhost:5432/neondb
      - run: npm run build
